<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaForce — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="login-page">

  <canvas id="bg-canvas"></canvas>

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-cube">N</div>
      <div class="login-logo-text">
        <span class="login-logo-name">NexaForce</span>
        <span class="login-logo-sub">Employee Hub</span>
      </div>
    </div>

    <h1 class="login-heading">Welcome Back</h1>
    <p class="login-subtitle">Sign in to your corporate dashboard</p>

    <!-- Form -->
    <form class="login-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input
          type="email"
          id="loginEmail"
          value="admin@nexaforce.com"
          placeholder="admin@nexaforce.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="loginPassword"
            value="Admin@123"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="input-toggle" id="pwToggle" title="Show/hide password">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnLoginText">Sign In</span>
      </button>
    </form>

    <p class="login-hint">
      Demo credentials: <code>admin@nexaforce.com</code> / <code>Admin@123</code>
    </p>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast">
    <span class="toast-icon" id="toastIcon"></span>
    <span id="toastMsg"></span>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/three-bg.js"></script>
  <script>
    'use strict';

    // Redirect if already logged in
    if (Auth.isAuth()) {
      window.location.href = 'dashboard.html';
    }

    initThreeJS('bg-canvas', 1.0);

    // Password visibility toggle
    document.getElementById('pwToggle').addEventListener('click', function () {
      const input = document.getElementById('loginPassword');
      if (input.type === 'password') {
        input.type = 'text';
        this.textContent = '🙈';
      } else {
        input.type = 'password';
        this.textContent = '👁';
      }
    });

    // Toast helper
    let _toastTimer;
    function showToast(msg, type) {
      if (type === undefined) type = 'info';
      const toast  = document.getElementById('toast');
      const icon   = document.getElementById('toastIcon');
      const msgEl  = document.getElementById('toastMsg');
      const icons  = { success: '✅', error: '❌', info: 'ℹ️' };
      toast.className = 'toast toast-' + type;
      icon.textContent  = icons[type] || icons.info;
      msgEl.textContent = msg;
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 3500);
    }

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please enter email and password', 'error');
        return;
      }

      const btn     = document.getElementById('btnLogin');
      const btnText = document.getElementById('btnLoginText');
      btn.disabled  = true;
      btnText.textContent = 'Signing in…';

      try {
        const result = await API.login({ email, password });
        Auth.setToken(result.token);
        Auth.setUser(result.user);
        showToast('Login successful! Redirecting…', 'success');
        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 600);
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
